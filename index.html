<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Sector Heatmap</title>
<style>
:root{font-family:Inter,Arial,'Noto Sans KR',sans-serif;color:#e8eef6;background:#0b1019;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#172338 0%,#0b1019 50%);min-height:100vh}main{max-width:1200px;margin:auto;padding:36px 28px 70px}.eyebrow{color:#93a4b9;font-size:12px;letter-spacing:.13em;font-weight:700}.header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:27px}h1{font-size:clamp(24px,4vw,36px);margin:9px 0 8px;letter-spacing:-.04em}p{margin:0;color:#91a0b6;font-size:13px}.sample{display:flex;align-items:center;gap:8px;color:#aab6c7;background:#202939;border:1px solid #39465b;border-radius:25px;padding:9px 13px;font-size:12px;white-space:nowrap}.sample i{display:inline-block;width:7px;height:7px;background:#e6b968;border-radius:50%}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#121b2a;border:1px solid #26354a;padding:14px 17px;border-radius:14px;margin-bottom:16px;flex-wrap:wrap}.tabs{background:#0c1421;border-radius:9px;padding:4px;display:flex;gap:4px}.tabs button{border:0;background:transparent;color:#96a5bb;padding:9px 23px;font-size:13px;cursor:pointer;border-radius:7px;font-weight:700}.tabs button.active{background:#304359;color:white;box-shadow:0 1px 3px #080e16}.period{font-size:12px;color:#aab7c9}.overview{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:23px}.metric{max-width:360px;background:#131e2e;border:1px solid #26364c;border-radius:13px;padding:17px 19px}.metric .label{font-size:11px;color:#91a4bb;margin-bottom:9px}.metric .value{font-size:24px;font-weight:750;letter-spacing:-.025em}.metric .sub{font-size:11px;color:#8c9db3;margin-top:5px}.up{color:#ff727d}.down{color:#7db8ff}.headrow{display:flex;justify-content:space-between;gap:14px;align-items:end;margin:28px 0 13px}.headrow h2{font-size:16px;margin:0}.headrow span{color:#8294ab;font-size:12px}.heatmap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.group{background:#121b2a;border:1px solid #29364b;border-radius:14px;padding:14px;min-width:0}.group h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font-size:13px;color:#e0e9f3;font-weight:650}.group h3 small{color:#7f91a9;font-size:10px;font-weight:500}.tiles{display:grid;gap:7px}.bank{grid-column:span 6}.bank .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.ib{grid-column:span 3}.ib .tiles{grid-template-columns:1fr}.asset{grid-column:span 3}.asset .tiles{grid-template-columns:1fr}.payment{grid-column:span 6}.payment .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.digital{grid-column:span 6}.digital .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{color:#fff;min-height:104px;padding:14px;border-radius:9px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .15s,filter .15s;border:1px solid #ffffff24}.tile:hover{transform:translateY(-2px);filter:brightness(1.15)}.ticker{font-size:15px;font-weight:800;letter-spacing:.02em}.company{font-size:10px;color:#ffffffbc;margin-top:3px}.change{font-size:23px;font-weight:800;align-self:flex-end;letter-spacing:-.045em;text-shadow:0 1px 3px #0002}.legendwrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:20px;color:#8395ab;font-size:11px}.legend{display:flex;align-items:center;gap:10px}.gradient{width:230px;height:9px;border-radius:7px;background:linear-gradient(90deg,#2457a7,#a8c8e9,#e4e7ed,#f1abb2,#ab2037)}footer{border-top:1px solid #243249;margin-top:26px;padding-top:16px;color:#71849e;font-size:11px;line-height:1.6}@media(max-width:700px){main{padding:25px 14px 40px}.header{align-items:flex-start}.sample{font-size:10px}.overview{gap:7px}.metric{padding:12px}.metric .value{font-size:19px}.heatmap{gap:9px}.bank,.ib,.asset,.payment,.digital{grid-column:span 12}.ib .tiles,.asset .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:94px}.change{font-size:21px}.legendwrap{align-items:flex-start}}
</style>
</head>
<body><main>
<header class="header"><div><div class="eyebrow">US EQUITIES / FINANCIALS</div><h1>Financial Sector Heatmap</h1></div></header>
<div class="toolbar"><div class="tabs"><button id="daily" class="active">Daily</button><button id="weekly">Weekly</button></div><div class="period" id="period">전일 종가 기준</div></div>
<div class="overview"><div class="metric"><div class="label">시가총액 가중평균 수익률</div><div class="value" id="avg">--</div></div></div>
<div id="status" style="color:#91a4bb;font-size:12px;margin:0 0 12px">실제 시세 데이터 불러오는 중...</div>
<section class="heatmap" id="heatmap"></section>
<div class="legendwrap"><div class="legend"><span>-5% 이하</span><div class="gradient"></div><span>+5% 이상</span></div></div>

</main>
<script>
const groups=[
{name:'종합은행',cls:'bank',stocks:[['JPM','JPMorgan Chase'],['C','Citigroup'],['BAC','Bank of America'],['WFC','Wells Fargo']]},
{name:'투자은행',cls:'ib',stocks:[['GS','Goldman Sachs'],['MS','Morgan Stanley']]},
{name:'자산운용',cls:'asset',stocks:[['BLK','BlackRock']]},
{name:'결제',cls:'payment',stocks:[['V','Visa'],['MA','Mastercard'],['AXP','American Express']]},
{name:'디지털자산',cls:'digital',stocks:[['HOOD','Robinhood'],['COIN','Coinbase']]}
];
let timeframe='daily',records={},updated='';
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
function color(v){if(v===null||!Number.isFinite(v))return '#354358';let s=clamp(Math.abs(v)/5,0,1),low=v>=0?[238,167,174]:[156,193,231],hi=v>=0?[162,29,51]:[34,80,158];return `rgb(${low.map((n,i)=>Math.round(n+(hi[i]-n)*s)).join(',')})`}
function fmt(v){return v===null||!Number.isFinite(v)?'--':(v>=0?'+':'')+v.toFixed(2)+'%'}
function render(){
 const ix=timeframe==='daily'?'daily':'weekly';
 const selected=groups.flatMap(g=>g.stocks.map(s=>records[s[0]])).filter(s=>s&&Number.isFinite(s[ix])&&Number.isFinite(s.market_cap)&&s.market_cap>0);
 const cap=selected.reduce((a,s)=>a+s.market_cap,0);
 const avg=cap?selected.reduce((a,s)=>a+s[ix]*s.market_cap,0)/cap:null;
 const el=document.getElementById('avg');el.textContent=fmt(avg);el.className='value '+(avg===null?'':avg>=0?'up':'down');
 document.getElementById('period').textContent=timeframe==='daily'?'전일 종가 기준':'직전 주 금요일 종가 기준';
 document.getElementById('heatmap').innerHTML=groups.map(g=>`<article class="group ${g.cls}"><h3>${g.name}</h3><div class="tiles">${g.stocks.map(s=>{const r=records[s[0]]||{},v=Number.isFinite(r[ix])?r[ix]:null;return `<div class="tile" style="background:${color(v)}" title="${s[1]}: ${fmt(v)}"><div><div class="ticker">${s[0]}</div><div class="company">${s[1]}</div></div><div class="change">${fmt(v)}</div></div>`}).join('')}</div></article>`).join('');
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id===timeframe));
}
document.getElementById('daily').onclick=()=>{timeframe='daily';render()};
document.getElementById('weekly').onclick=()=>{timeframe='weekly';render()};
render();
fetch('./data/prices.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{
records=data.stocks||{};updated=data.as_of||'';
const count=Object.values(records).filter(s=>Number.isFinite(s.daily)).length;
document.getElementById('status').textContent=count?`기준일: ${updated} (미국 정규장 종가) | ${count}/12개 종목`:'가격 데이터가 없습니다. GitHub Actions의 Update prices 작업을 먼저 실행하세요.';
render();
}).catch(()=>{document.getElementById('status').textContent='가격 데이터가 없습니다. GitHub Actions의 Update prices 작업을 먼저 실행하세요.';});
</script></body></html>
